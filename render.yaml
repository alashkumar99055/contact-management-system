services:
  - type: web
    name: contactflow-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: contactflow-db
          property: connectionString
      - key: CORS_ORIGINS
        fromService:
          type: web
          name: contactflow-frontend
          property: host

  - type: static
    name: contactflow-frontend
    buildCommand: sed -i "s|__BACKEND_URL__|https://${BACKEND_HOST}|g" frontend/config.js
    staticPublishPath: frontend
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: contactflow-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: contactflow-db
